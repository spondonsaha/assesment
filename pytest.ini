[pytest]
testpaths = ui/tests api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v -ra --strict-markers
markers =
    ui: Selenium end-to-end UI tests
    api: ReqRes API tests
    q1: UI Q1 - locked_out_user error verification
    q2: UI Q2 - standard_user full purchase journey
    q3: UI Q3 - performance_glitch_user sorted purchase journey
    q3_api: API Q3 - login and capture authToken
    q4: API Q4 - GET user by id
    q5: API Q5 - PUT updated profile
    q6: API Q6 - PATCH single field
    q8: API Q8 - bad request (4xx) assertions
